version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Descargando Requerimientos"
      - pip install --upgrade pip
      - pip install -r requirements.txt
  build:
    commands:
      - echo "Iniciando la ejecucción de pruebas unitarias"
      #- python -m pytest --junitxml=reports/pruebas.xml
      - echo "Pruebas superadas, se genera el artefacto"

reports:
  unit-tests:
    files:
      - reports/pruebas.xml
    file-format: JUNITXML

artifacts:
  name: microservicio-flask
  files:
    - '**/*'
  exclude-paths:
    - tests/**/*
    - reports/**/*
    - .git/**/*
    - venv/**/*
    - .venv/**/*
    - '**/__pycache__/**/*'
    - buildspec.yml
